name: Remove bad cn.16 and cn.17 releases
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the faulty cn.16 and cn.17 releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.2.10-cn.16 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || echo "cn.16 already gone"
          gh release delete v0.2.10-cn.17 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || echo "cn.17 already gone"
